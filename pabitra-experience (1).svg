    <text x="1128" y="219" text-anchor="end" fill="#C77B9B" font-size="14" letter-spacing="1">2022–PRESENT</text>
    <text x="125" y="272" fill="#F8F0F3" opacity=".83" font-size="14">Web applications · REST API integration · responsive interfaces · performance optimization</text>
