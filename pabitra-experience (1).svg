    <text x="125" y="320" fill="#F8F0F3" font-size="20" font-weight="700">UI/UX Designer &amp; Web Developer</text>
    <text x="125" y="346" fill="#E5B5C7" font-size="16">Ad Your Dream Pvt. Ltd.</text>
    <text x="1128" y="321" text-anchor="end" fill="#C77B9B" font-size="14" letter-spacing="1">2021–2022</text>
    <text x="125" y="374" fill="#F8F0F3" opacity=".83" font-size="14">Responsive website design · modern interface implementation</text>
