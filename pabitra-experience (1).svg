<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="experience-title experience-desc">
<title id="experience-title">Experience — Pabitra Swain</title>
<desc id="experience-desc">A burgundy animated timeline showing resume-listed roles at Atreya Associates, Ad Your Dream Pvt. Ltd., and freelance front-end development.</desc>
<defs>
  <linearGradient id="exp-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10070C"/><stop offset=".55" stop-color="#190B12"/><stop offset="1" stop-color="#2A0D1B"/>
    <animate attributeName="x1" values="0;.6;0" dur="16s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="exp-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#701A3D" stop-opacity=".15"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D" stop-opacity=".15"/>
    <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="exp-glow"><stop offset="0" stop-color="#701A3D" stop-opacity=".32"/><stop offset="1" stop-color="#10070C" stop-opacity="0"/></radialGradient>
  <pattern id="exp-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C77B9B" stroke-opacity=".075"/></pattern>
  <filter id="exp-soft-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="520" rx="22" fill="url(#exp-bg)"/><rect width="1200" height="520" rx="22" fill="url(#exp-grid)"/>
<ellipse cx="1080" cy="80" rx="260" ry="210" fill="url(#exp-glow)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
