  <text x="64" y="145" fill="#E5B5C7" font-size="34" font-weight="750">design, code &amp; iteration.</text>
  <path d="M64 166H1135" stroke="#451126" stroke-width="1.5"/>
  <path d="M64 166H360" stroke="url(#exp-line)" stroke-width="2.5" filter="url(#exp-soft-glow)"><animate attributeName="d" values="M64 166H140;M64 166H1135;M64 166H140" dur="7s" repeatCount="indefinite"/></path>
  <path d="M92 216V438" stroke="#701A3D" stroke-width="2"/>
  <path d="M92 216V438" stroke="url(#exp-line)" stroke-width="2.5" stroke-dasharray="42 300" filter="url(#exp-soft-glow)"><animate attributeName="stroke-dashoffset" values="0;-342" dur="8s" repeatCount="indefinite"/></path>
  <g>
