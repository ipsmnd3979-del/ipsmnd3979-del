<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">About Pabitra Swain</title><desc id="d">Animated burgundy profile card describing Pabitra Swain's focus on web development, responsive interfaces, UI/UX, API integration and creative digital experiences.</desc>
<defs>
<linearGradient id="about-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset=".55" stop-color="#190B12"/><stop offset="1" stop-color="#301020"/><animate attributeName="x1" values="0;.6;0" dur="16s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="about-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D" stop-opacity=".1"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D" stop-opacity=".1"/><animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="about-halo"><stop offset="0" stop-color="#701A3D" stop-opacity=".4"/><stop offset="1" stop-color="#10070C" stop-opacity="0"/></radialGradient>
<pattern id="about-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C77B9B" stroke-opacity=".09"/></pattern>
<filter id="about-glow" x="-80%" y="-300%" width="260%" height="700%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="440" rx="22" fill="url(#about-bg)"/><rect width="1200" height="440" rx="22" fill="url(#about-grid)"/><ellipse cx="1010" cy="210" rx="280" ry="260" fill="url(#about-halo)"/>
<g fill="none" stroke="#C77B9B" stroke-opacity=".42"><circle cx="1010" cy="210" r="128" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" from="0 1010 210" to="360 1010 210" dur="42s" repeatCount="indefinite"/></circle><circle cx="1010" cy="210" r="158" stroke-opacity=".2"/><ellipse cx="1010" cy="210" rx="202" ry="75" transform="rotate(-32 1010 210)" stroke-opacity=".3"><animateTransform attributeName="transform" type="rotate" from="-32 1010 210" to="328 1010 210" dur="54s" repeatCount="indefinite"/></ellipse></g>
<circle cx="882" cy="210" r="4" fill="#E5B5C7" filter="url(#about-glow)"><animateMotion dur="12s" repeatCount="indefinite" path="M0 0 A128 128 0 1 1 .1 0"/></circle>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="64" y="58" fill="#C77B9B" font-size="13" letter-spacing="4">PROFILE / ABOUT</text>
<text x="64" y="112" fill="#F8F0F3" font-size="38" font-weight="750">Curious by nature.</text><text x="64" y="158" fill="#E5B5C7" font-size="38" font-weight="750">Creative by design.</text>
<path d="M64 180H650" stroke="#451126" stroke-width="2"/><path d="M64 180H300" stroke="url(#about-line)" stroke-width="3" filter="url(#about-glow)"><animate attributeName="d" values="M64 180H190;M64 180H650;M64 180H190" dur="6s" repeatCount="indefinite"/></path>
<text x="64" y="222" fill="#F8F0F3" font-size="17">I'm Pabitra Swain — a web developer who enjoys</text><text x="64" y="250" fill="#F8F0F3" font-size="17">building responsive interfaces and useful digital experiences.</text>
<text x="64" y="292" fill="#C77B9B" font-size="12" letter-spacing="3">AREAS I WORK IN</text>
<g font-size="13" fill="#F8F0F3"><rect x="64" y="310" width="155" height="34" rx="17" fill="#451126" stroke="#701A3D"/><text x="141" y="332" text-anchor="middle">Front-end development</text><rect x="230" y="310" width="105" height="34" rx="17" fill="#451126" stroke="#701A3D"/><text x="282" y="332" text-anchor="middle">UI / UX</text><rect x="346" y="310" width="130" height="34" rx="17" fill="#451126" stroke="#701A3D"/><text x="411" y="332" text-anchor="middle">API integration</text><rect x="487" y="310" width="115" height="34" rx="17" fill="#451126" stroke="#701A3D"/><text x="544" y="332" text-anchor="middle">WordPress</text></g>
<text x="64" y="386" fill="#E5B5C7" font-size="13" letter-spacing="1.5">THOUGHTFUL DESIGN · CLEAN IMPLEMENTATION · CONTINUOUS LEARNING</text><text x="1140" y="400" text-anchor="end" fill="#C77B9B" font-size="11" letter-spacing="3">PS / 01</text></g>
<path d="M0 414C210 380 315 450 515 414S820 390 1010 414 1120 432 1200 405" fill="none" stroke="url(#about-line)" stroke-width="1.5"><animate attributeName="d" dur="10s" repeatCount="indefinite" values="M0 414C210 380 315 450 515 414S820 390 1010 414 1120 432 1200 405;M0 414C210 440 315 390 515 414S820 440 1010 414 1120 390 1200 405;M0 414C210 380 315 450 515 414S820 390 1010 414 1120 432 1200 405"/></path>
</svg>